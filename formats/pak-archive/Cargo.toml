[package]
name = "pak-archive"
version = "0.1.0"
edition = "2024"
authors = ["ed1th"]
categories = ["encoding", "parser-implementations", "compression"]
keywords = ["popcap", "pak", "archive", "plants-vs-zombies"]
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LambdaEd1th/pak-archive"
description = "Pure Rust reader and writer for PopCap PAK resource archives"

[features]
default = ["serde", "tv"]
serde = ["dep:serde", "dep:serde_bytes"]
tv = ["dep:crc32fast", "dep:zip"]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1.5.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.19", optional = true }
thiserror = "2.0.20"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "unreserved"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "indexing"
harness = false
